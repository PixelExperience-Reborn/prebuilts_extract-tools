name: AOSP17 legacy extract-tools host-only source gate

on:
  push:
    branches:
      - audit/a17-extract-tools-host-only-20261106
    paths:
      - 'audit/check_extract_tools_source.py'
      - 'docs/ANDROID_17_EXTRACT_TOOLS_HOST_AUDIT.md'
      - '.github/workflows/a17-extract-tools-host-only-check.yml'
  pull_request:
    paths:
      - 'audit/check_extract_tools_source.py'
      - 'docs/ANDROID_17_EXTRACT_TOOLS_HOST_AUDIT.md'
      - '.github/workflows/a17-extract-tools-host-only-check.yml'

permissions:
  contents: read

jobs:
  audit-archived-host-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout PE archived binaries with audit metadata
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Fetch exact original PE seventeen ref
        run: |
          git fetch -q --no-tags --depth=1 origin \
            +refs/heads/seventeen:refs/remotes/origin/seventeen
      - name: Fetch staged PixelExperience-Reborn AOSP17 manifest
        run: |
          git clone -q --depth=1 \
            --branch port/a17-aosp17-manifest-20261102 \
            https://github.com/PixelExperience-Reborn/manifest.git \
            "$RUNNER_TEMP/manifest"
      - name: Verify Git object inventory, source ownership and exclusion
        run: |
          python3 audit/check_extract_tools_source.py \
            "$GITHUB_WORKSPACE" "$RUNNER_TEMP/manifest"
      - name: Run manifest positive and negative regression tests
        run: |
          cd "$RUNNER_TEMP/manifest"
          python3 -m unittest discover -s tools \
            -p 'test_aosp17_manifest_entrypoint.py' -v
      - name: Check effective default graph with official repo client
        run: |
          curl --fail --silent --show-error --location \
            https://storage.googleapis.com/git-repo-downloads/repo \
            --output "$RUNNER_TEMP/repo"
          chmod +x "$RUNNER_TEMP/repo"
          mkdir -p "$RUNNER_TEMP/repo-graph"
          cd "$RUNNER_TEMP/repo-graph"
          "$RUNNER_TEMP/repo" init -q --no-clone-bundle \
            -u https://github.com/PixelExperience-Reborn/manifest \
            -b port/a17-aosp17-manifest-20261102 -m default.xml
          "$RUNNER_TEMP/repo" manifest -o "$RUNNER_TEMP/resolved.xml"
          python3 - <<'PY'
          from pathlib import Path
          import os
          import xml.etree.ElementTree as ET

          root = ET.parse(Path(os.environ["RUNNER_TEMP"]) / "resolved.xml").getroot()
          projects = root.findall(".//project")
          paths = {p.get("path") or p.get("name"): p.get("name") for p in projects}
          assert len(projects) == 1069, len(projects)
          assert len(paths) == len(projects), "duplicate source owner"
          assert "prebuilts/extract-tools" not in paths, "unreviewed host binaries imported"
          assert "prebuilts_extract-tools" not in paths.values(), "archived PE repo imported"
          assert paths["prebuilts/build-tools"] == "platform/prebuilts/build-tools"
          assert paths["prebuilts/tools"] == "platform/prebuilts/tools"
          print("PASS: repo manifest excludes archived PE extract-tools; official AOSP17 tools retained")
          print("PASS: 1069 selected projects, no duplicate owners")
          PY
      - name: State scope and pending gates
        run: |
          echo "SOURCE-ONLY: Git tree metadata and official manifest selection checked."
          echo "LEGACY BINARY EXECUTION: prohibited; no old tools executed."
          echo "OPEN: trusted host tool provenance, Python extraction, real OTA test, Soong, mondrian."
